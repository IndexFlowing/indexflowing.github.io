name: 自动通知n8n

on:
  push:
    branches:
      - main
    paths:
      - 'content/zh/**/index.md'

jobs:
  notify-n8n:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 提取变动的中文文章
        id: get_articles
        run: |
          DIFF=$(git diff-tree -r --no-commit-id --name-status -r ${{ github.sha }} | grep -E '^[AM].*content/zh/.*/index\.md$' | cut -f2- || true)
          echo "检测到的中文文章变更："
          echo "$DIFF"

          JSON_FILES=$(echo "$DIFF" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$JSON_FILES" >> $GITHUB_OUTPUT

      - name: 发送请求到n8n
        if: steps.get_articles.outputs.files != '[]' && steps.get_articles.outputs.files != ''
        run: |
          curl -X POST "https://n8n.indexflowing.com/webhook/article-push" \
            -H "Content-Type: application/json" \
            -d '{
              "commit_id": "${{ github.sha }}",
              "commit_message": ${{ toJson(github.event.head_commit.message) }},
              "files": ${{ steps.get_articles.outputs.files }},
              "repo": "${{ github.repository }}"
            }'
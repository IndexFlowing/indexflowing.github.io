baseURL: "https://indexflowing.github.io/"
title: "Vincent's Tech Lab"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

# 🌟 1. 开启中英双语国际化 (i18n)
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    title: "Vincent's Tech Lab"
    params:
      homeInfoParams:
        Title: "Building useful things for the web."
        Content: "Notes on products, engineering, and the systems behind them."
    menu:
      main:
        - identifier: posts
          name: "Posts"
          url: "/posts/"
          weight: 10
        - identifier: categories
          name: "Topics"
          url: "/categories/"
          weight: 20
        - identifier: tags
          name: "Tags"
          url: "/tags/"
          weight: 30

  zh:
    languageName: "简体中文"
    weight: 2
    title: "文森特的工程实验室"
    params:
      homeInfoParams:
        Title: "构建真正有用的 Web 产品。"
        Content: "记录产品、工程实践，以及支撑它们运转的系统。"
    menu:
      main:
        - identifier: posts
          name: "文章"
          url: "/zh/posts/"
          weight: 10
        - identifier: categories
          name: "核心项目"
          url: "/zh/categories/"
          weight: 20

# 🌟 2. 全局样式与页脚定制
params:
  env: production
  defaultTheme: "dark"
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  mainSections:
    - posts

  socialIcons:
    - name: "github"
      url: "https://github.com/indexflowing"